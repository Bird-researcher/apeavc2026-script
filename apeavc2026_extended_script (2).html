<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEAVC 2026 | Extended Presentation Script</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans Thai","Noto Sans JP",sans-serif;color:#172d3b;background:#f4f7f9}body{margin:0}header{background:#12384a;color:white;padding:32px max(20px,calc((100vw - 880px)/2))}h1{font-size:clamp(22px,4vw,32px);line-height:1.3;margin:8px 0}header p{opacity:.85}main{max-width:880px;margin:auto;padding:24px 16px 80px}.controls{position:sticky;top:0;background:#f4f7f9;padding:12px 0;display:flex;gap:8px;z-index:2}button{font:inherit;border:1px solid #a9bbc5;border-radius:8px;padding:11px 17px;background:white;cursor:pointer}button[aria-pressed=true]{background:#12384a;color:white;border-color:#12384a}section{background:white;border:1px solid #dae3e9;border-radius:12px;padding:20px 24px;margin:0 0 18px;box-shadow:0 2px 6px #1b354010}h2{font-size:19px;margin:0 0 15px;color:#165477}.paragraph{font-size:17px;line-height:1.85;margin:0 0 12px;white-space:pre-wrap}footer{font-size:13px;color:#51616d;margin-top:24px}@media(max-width:550px){section{padding:18px 16px}.controls button{flex:1;padding:10px 4px}.paragraph{font-size:16px}}</style></head><body><header><div>APEAVC 2026 · Extended script</div><h1>Electrocardiographic Waveforms in Conscious Small Psittacines Using a Novel Device</h1><p>Masaya Mizukami · English / 日本語 / ภาษาไทย</p></header><main><nav class="controls" aria-label="Language"><button data-lang="en" aria-pressed="true">English</button><button data-lang="ja" aria-pressed="false">日本語</button><button data-lang="th" aria-pressed="false">ภาษาไทย</button></nav><div id="slides"></div><footer>Presentation script · 17 slides</footer></main><script>
const slides=[{"number": 1, "heading": "QR Code Introduction", "en": ["For those who would like to follow the presentation more easily, I have prepared a presentation script in English, Japanese, and Thai.", "Please feel free to scan the QR code on this slide."], "th": ["สำหรับท่านที่ต้องการติดตามและทำความเข้าใจเนื้อหาการนำเสนอได้ง่ายยิ่งขึ้น ผมได้จัดเตรียมบทบรรยายการนำเสนอไว้ 3 ภาษา ได้แก่ ภาษาอังกฤษ ภาษาญี่ปุ่น และภาษาไทย", "ท่านสามารถสแกนคิวอาร์โค้ดที่อยู่บนสไลด์นี้เพื่ออ่านบทบรรยายได้ตามสะดวก"], "ja": ["発表内容をより理解しやすくするために、英語、日本語、タイ語の3言語で発表原稿を用意しました。", "ご希望の方は、このスライドにあるQRコードを読み取ってご覧ください。"]}, {"number": 2, "heading": "Title", "en": ["Good morning, everyone.", "My name is Masaya Mizukami, from Avian Medical Center Mizukami in Japan.", "Today, I would like to present our study entitled, “Electrocardiographic Waveforms in Conscious Small Psittacines Using a Novel Device.”", "In this study, we developed a novel coil-shaped device for ECG recording in conscious small birds, without sedation or anesthesia."], "th": ["สวัสดีตอนเช้าครับทุกท่าน", "ผมชื่อ มาซายะ มิซึคามิ จากศูนย์การแพทย์นกมิซึคามิ ประเทศญี่ปุ่น", "วันนี้ผมขอนำเสนอผลงานวิจัยของเราในหัวข้อ “รูปคลื่นไฟฟ้าหัวใจในนกแก้วขนาดเล็กที่รู้สึกตัว โดยใช้อุปกรณ์ชนิดใหม่”", "ในการศึกษานี้ เราได้พัฒนาอุปกรณ์ชนิดใหม่ที่มีลักษณะเป็นขดลวด สำหรับบันทึกคลื่นไฟฟ้าหัวใจในนกขนาดเล็กที่รู้สึกตัว โดยไม่ใช้ยาซึมหรือยาสลบ"], "ja": ["皆さん、おはようございます。", "私は日本の鳥類医療センター水上の水上昌也です。", "本日は、「新規デバイスを用いた覚醒下の小型オウム・インコ類における心電図波形」と題した研究について発表いたします。", "本研究では、鎮静や麻酔を使用せず、覚醒下の小型鳥類から心電図を記録するための、新しいコイル状デバイスを開発しました。"]}, {"number": 3, "heading": "Introduction: Heart Disease", "en": ["First, I would like to briefly introduce the background of this study.", "Various cardiac diseases have been reported in different avian species.", "For example, congenital heart diseases, including ventricular septal defects, have been reported in cockatoos.", "In Amazon parrots, pericardial mesothelioma and suspected pulmonary arterial hypertension have also been described.", "In addition, cardiomyopathy and heart failure have been reported in other avian species, including penguins, raptors, and pheasants.", "These reports indicate that cardiovascular disease is an important clinical problem in birds."], "th": ["ก่อนอื่น ผมขออธิบายถึงความเป็นมาของการศึกษานี้โดยสังเขป", "มีรายงานการพบโรคหัวใจหลายชนิดในนกหลากหลายสายพันธุ์", "ตัวอย่างเช่น ในนกกระตั้ว มีรายงานการพบโรคหัวใจพิการแต่กำเนิด รวมถึงภาวะผนังกั้นหัวใจห้องล่างรั่ว", "ในนกแก้วอเมซอน มีรายงานการพบมะเร็งเยื่อหุ้มหัวใจชนิดเมโซเธลิโอมา และกรณีที่สงสัยว่ามีภาวะความดันหลอดเลือดแดงปอดสูง", "นอกจากนี้ ยังมีรายงานการพบโรคกล้ามเนื้อหัวใจและภาวะหัวใจล้มเหลวในนกชนิดอื่น ๆ เช่น นกเพนกวิน นกล่าเหยื่อ และนกในวงศ์ไก่ฟ้า", "รายงานเหล่านี้แสดงให้เห็นว่าโรคหัวใจและหลอดเลือดเป็นปัญหาทางคลินิกที่สำคัญในนก"], "ja": ["まず、本研究の背景について簡単にご説明します。", "さまざまな鳥類において、多様な心疾患が報告されています。", "例えば、オウム類では、心室中隔欠損症を含む先天性心疾患が報告されています。", "アマゾンインコ類では、心膜中皮腫や肺動脈性肺高血圧症が疑われる症例も報告されています。", "さらに、ペンギン類、猛禽類、キジ類など、その他の鳥類においても、心筋症や心不全が報告されています。", "これらの報告は、心血管疾患が鳥類における重要な臨床上の問題であることを示しています。"]}, {"number": 4, "heading": "Introduction: Arrhythmia", "en": ["Various types of arrhythmias have also been reported in birds.", "For example, atrial premature contractions and atrial fibrillation have been documented in chickens.", "In pigeons, sinus arrhythmia, sinoatrial block, sinus arrest, and second-degree atrioventricular block have been described.", "Ventricular premature contractions and other conduction abnormalities have also been reported.", "In Amazon parrots, second-degree atrioventricular block has been documented.", "Therefore, accurate ECG evaluation is important for detecting and understanding cardiac abnormalities in birds."], "th": ["มีรายงานการพบภาวะหัวใจเต้นผิดจังหวะหลายประเภทในนกเช่นกัน", "ตัวอย่างเช่น ในไก่ มีรายงานการพบภาวะหัวใจห้องบนบีบตัวก่อนกำหนด และภาวะหัวใจห้องบนสั่นพลิ้ว", "ในนกพิราบ มีรายงานการพบภาวะหัวใจเต้นผิดจังหวะจากไซนัส ภาวะการนำไฟฟ้าระหว่างโหนดไซนัสและหัวใจห้องบนถูกปิดกั้น ภาวะโหนดไซนัสหยุดทำงาน และภาวะการนำไฟฟ้าระหว่างหัวใจห้องบนและห้องล่างถูกปิดกั้นระดับที่สอง", "นอกจากนี้ ยังมีรายงานการพบภาวะหัวใจห้องล่างบีบตัวก่อนกำหนด และความผิดปกติอื่น ๆ ของระบบการนำไฟฟ้าหัวใจ", "ในนกแก้วอเมซอน มีรายงานการพบภาวะการนำไฟฟ้าระหว่างหัวใจห้องบนและห้องล่างถูกปิดกั้นระดับที่สอง", "ดังนั้น การตรวจประเมินคลื่นไฟฟ้าหัวใจอย่างแม่นยำจึงมีความสำคัญต่อการตรวจพบและทำความเข้าใจความผิดปกติของหัวใจในนก"], "ja": ["鳥類では、さまざまな種類の不整脈も報告されています。", "例えば、ニワトリでは、心房期外収縮や心房細動が報告されています。", "ハトでは、洞性不整脈、洞房ブロック、洞停止、および第2度房室ブロックが報告されています。", "また、心室期外収縮やその他の刺激伝導異常も報告されています。", "アマゾンインコ類では、第2度房室ブロックが報告されています。", "したがって、鳥類における心臓の異常を検出し、理解するためには、正確な心電図評価が重要です。"]}, {"number": 5, "heading": "Introduction: Challenges in ECG Acquisition", "en": ["However, obtaining an ECG from small birds is challenging.", "In clinical practice, an arrhythmia may be suspected during auscultation, but confirmation can be difficult.", "Standard ECG recording is often complicated by handling stress and motion artifacts.", "Sedation or anesthesia may facilitate recording, but these procedures can also affect cardiovascular function.", "Therefore, we needed a simple and reliable method for ECG recording in conscious birds during routine physical restraint."], "th": ["อย่างไรก็ตาม การบันทึกคลื่นไฟฟ้าหัวใจในนกขนาดเล็กยังคงเป็นเรื่องที่ท้าทาย", "ในทางคลินิก อาจสงสัยว่ามีภาวะหัวใจเต้นผิดจังหวะจากการฟังเสียงหัวใจ แต่การยืนยันการวินิจฉัยอาจทำได้ยาก", "การบันทึกคลื่นไฟฟ้าหัวใจด้วยวิธีมาตรฐานมักประสบปัญหาจากความเครียดที่เกิดจากการจับบังคับนก และสัญญาณรบกวนที่เกิดจากการเคลื่อนไหวของร่างกาย", "การใช้ยาซึมหรือยาสลบอาจช่วยให้การบันทึกคลื่นไฟฟ้าหัวใจทำได้ง่ายขึ้น แต่การใช้ยาเหล่านี้อาจส่งผลต่อการทำงานของระบบหัวใจและหลอดเลือดได้เช่นกัน", "ดังนั้น เราจึงจำเป็นต้องมีวิธีการบันทึกคลื่นไฟฟ้าหัวใจที่ง่ายและเชื่อถือได้ สำหรับนกที่ยังรู้สึกตัวในระหว่างการจับบังคับตามปกติ"], "ja": ["しかし、小型鳥類から心電図を記録することは容易ではありません。", "臨床現場では、聴診によって不整脈が疑われることがありますが、その確定診断は困難な場合があります。", "従来の心電図記録では、保定によるストレスや体動に伴うアーチファクトが問題となることが少なくありません。", "鎮静や麻酔によって心電図の記録が容易になる場合もありますが、これらの処置は心血管機能に影響を及ぼす可能性があります。", "そのため、覚醒下の鳥類に対して、通常の身体保定中に心電図を記録できる、簡便で信頼性の高い方法が必要でした。"]}, {"number": 6, "heading": "Objectives", "en": ["Based on these challenges, we established three objectives.", "First, to evaluate the feasibility of our novel coil-shaped device for ECG recording without sedation or anesthesia.", "Second, to establish baseline Lead II ECG morphology in conscious small psittacines.", "Third, to evaluate its clinical utility for visualizing abnormal waveforms and arrhythmias."], "th": ["จากความท้าทายเหล่านี้ เราจึงกำหนดวัตถุประสงค์ของการศึกษาไว้ 3 ประการ", "ประการแรก เพื่อประเมินความเป็นไปได้ในการใช้อุปกรณ์ชนิดใหม่ที่มีลักษณะเป็นขดลวดของเรา สำหรับการบันทึกคลื่นไฟฟ้าหัวใจโดยไม่ใช้ยาซึมหรือยาสลบ", "ประการที่สอง เพื่อศึกษาลักษณะพื้นฐานของรูปคลื่นไฟฟ้าหัวใจจากลีด II ในนกแก้วขนาดเล็กที่ยังรู้สึกตัว", "ประการที่สาม เพื่อประเมินประโยชน์ทางคลินิกของวิธีการนี้ในการแสดงรูปคลื่นไฟฟ้าหัวใจที่ผิดปกติและภาวะหัวใจเต้นผิดจังหวะ"], "ja": ["これらの課題を踏まえ、本研究では3つの目的を設定しました。", "第一に、鎮静や麻酔を使用せずに心電図を記録するための、新しいコイル状デバイスの実用可能性を評価することです。", "第二に、覚醒下の小型オウム・インコ類における第Ⅱ誘導心電図波形の基本的な形態を明らかにすることです。", "第三に、異常波形や不整脈を可視化するための、本手法の臨床的有用性を評価することです。"]}, {"number": 7, "heading": "Materials and Methods: Novel Device", "en": ["We developed a novel coil-shaped electrode device for ECG recording in small birds.", "The examiner wears gloves, and the coil electrodes are attached to the index and middle fingers.", "This design allows ECG recording to be incorporated into the routine restraint technique."], "th": ["เราได้พัฒนาอุปกรณ์อิเล็กโทรดชนิดใหม่ที่มีลักษณะเป็นขดลวด สำหรับบันทึกคลื่นไฟฟ้าหัวใจในนกขนาดเล็ก", "ผู้ตรวจสวมถุงมือ และติดตั้งอิเล็กโทรดรูปขดลวดไว้ที่นิ้วชี้และนิ้วกลาง", "การออกแบบนี้ช่วยให้สามารถบันทึกคลื่นไฟฟ้าหัวใจได้ในระหว่างการจับบังคับนกด้วยวิธีตามปกติ"], "ja": ["私たちは、小型鳥類の心電図を記録するために、新しいコイル状電極デバイスを開発しました。", "検査者は手袋を着用し、人差し指と中指にコイル状電極を装着します。", "この構造により、通常の保定方法を利用しながら心電図を記録することができます。"]}, {"number": 8, "heading": "Materials and Methods: Recording Procedure", "en": ["For ECG recording, the birds were restrained using a standard restraint technique.", "The bird's head and neck were gently positioned between the index and middle fingers.", "The feathers were parted, and ECG cream was applied to the exposed skin.", "Clip electrodes were then attached to both legs.", "The new device allows ECG recording during routine physical restraint."], "th": ["ในการบันทึกคลื่นไฟฟ้าหัวใจ เราใช้วิธีการจับบังคับนกตามมาตรฐาน", "ศีรษะและลำคอของนกถูกประคองไว้อย่างนุ่มนวลระหว่างนิ้วชี้และนิ้วกลาง", "จากนั้นแหวกขนออก และทาครีมสำหรับตรวจคลื่นไฟฟ้าหัวใจลงบนผิวหนังที่เปิดเผย", "หลังจากนั้น ติดอิเล็กโทรดแบบคลิปเข้ากับขาทั้งสองข้าง", "อุปกรณ์ชนิดใหม่นี้ช่วยให้สามารถบันทึกคลื่นไฟฟ้าหัวใจได้ในระหว่างการจับบังคับนกตามปกติ"], "ja": ["心電図の記録には、一般的な保定方法を用いました。", "鳥の頭部と頸部を、人差し指と中指の間で優しく保持しました。", "羽毛をかき分け、露出した皮膚に心電図用クリームを塗布しました。", "その後、両脚にクリップ電極を装着しました。", "この新しいデバイスにより、通常の身体保定中に心電図を記録することができます。"]}, {"number": 9, "heading": "Materials and Methods: Advantages", "en": ["This method has three main advantages.", "First, it requires no sedation or anesthesia.", "Second, anyone familiar with proper physical restraint of small birds can perform the measurement.", "Finally, the procedure is safe, quick, and relatively easy.", "Because anesthesia is not required, the method may also avoid potential effects of anesthetic agents on cardiac function."], "th": ["วิธีการนี้มีข้อดีหลัก 3 ประการ", "ประการแรก ไม่จำเป็นต้องใช้ยาซึมหรือยาสลบ", "ประการที่สอง ผู้ที่มีความชำนาญในการจับบังคับนกขนาดเล็กอย่างถูกต้องสามารถทำการตรวจวัดได้", "ประการที่สาม ขั้นตอนการตรวจมีความปลอดภัย รวดเร็ว และทำได้ค่อนข้างง่าย", "นอกจากนี้ เนื่องจากไม่จำเป็นต้องใช้ยาสลบ วิธีการนี้จึงอาจช่วยหลีกเลี่ยงผลกระทบที่อาจเกิดขึ้นจากยาสลบต่อการทำงานของหัวใจได้"], "ja": ["この方法には、主に3つの利点があります。", "第一に、鎮静や麻酔を必要としないことです。", "第二に、小型鳥類の適切な身体保定に習熟していれば、誰でも測定を行うことができます。", "第三に、この手技は安全かつ迅速で、比較的容易に実施できることです。", "また、麻酔を必要としないため、麻酔薬が心機能に及ぼす潜在的な影響を回避できる可能性があります。"]}, {"number": 10, "heading": "Materials and Methods: Study Animals", "en": ["This study was conducted from February 2020 through December 2023.", "We examined twenty-two conscious small parakeets without sedation or anesthesia.", "ECGs were recorded using a Cardisuny D800 electrocardiograph.", "Using this device, we obtained stable ECG waveforms for further analysis."], "th": ["การศึกษานี้ดำเนินการตั้งแต่เดือนกุมภาพันธ์ พ.ศ. 2563 ถึงเดือนธันวาคม พ.ศ. 2566", "เราได้ตรวจนกแก้วขนาดเล็กที่รู้สึกตัวจำนวน 22 ตัว โดยไม่ใช้ยาซึมหรือยาสลบ", "การบันทึกคลื่นไฟฟ้าหัวใจดำเนินการโดยใช้เครื่องตรวจคลื่นไฟฟ้าหัวใจ Cardisuny D800", "ด้วยการใช้อุปกรณ์นี้ เราสามารถบันทึกรูปคลื่นไฟฟ้าหัวใจที่มีความเสถียร เพื่อนำไปใช้ในการวิเคราะห์ต่อไป"], "ja": ["本研究は、2020年2月から2023年12月にかけて実施しました。", "鎮静や麻酔を使用せず、覚醒下の小型インコ類22羽を検査しました。", "心電図の記録には、Cardisuny D800心電計を使用しました。", "この装置を用いることで、安定した心電図波形が得られ、その後の解析に使用しました。"]}, {"number": 11, "heading": "Materials and Methods: ECG Analysis", "en": ["We selected the four avian species with the highest number of measurements.", "For each individual, five stable Lead II waveforms were extracted.", "We then calculated and analyzed the mean values for each species.", "As shown here, avian Lead II waveforms have a characteristic morphology, including a prominent negative S wave.", "We focused on the amplitudes of the P, Q, R, S, and T waves."], "th": ["เราได้คัดเลือกนก 4 ชนิดที่มีจำนวนการตรวจวัดมากที่สุด", "สำหรับนกแต่ละตัว เราได้คัดเลือกรูปคลื่นไฟฟ้าหัวใจที่มีความเสถียรจากลีด II จำนวน 5 รูปคลื่น", "จากนั้น เราคำนวณค่าเฉลี่ยและทำการวิเคราะห์ข้อมูลสำหรับนกแต่ละชนิด", "ดังที่แสดงในสไลด์นี้ รูปคลื่นไฟฟ้าหัวใจจากลีด II ของนกมีลักษณะเฉพาะ โดยมีคลื่น S ที่เป็นลบอย่างเด่นชัด", "เราให้ความสำคัญกับการวัดแอมพลิจูดของคลื่น P, Q, R, S และ T"], "ja": ["測定数が最も多かった4種類の鳥類を選択しました。", "各個体について、第Ⅱ誘導で記録された安定した心電図波形を5波形抽出しました。", "その後、各鳥種の平均値を算出し、解析しました。", "ここに示すように、鳥類の第Ⅱ誘導心電図波形には、顕著な陰性S波を含む特徴的な形態が認められます。", "私たちは、P波、Q波、R波、S波、T波の振幅に着目しました。"]}, {"number": 12, "heading": "Results: Stable ECG Recording", "en": ["Now, I would like to present our results.", "We obtained stable ECG waveforms from conscious small birds, as shown in this video.", "This recording was obtained from a Green-cheeked Parakeet without sedation or anesthesia.", "[Video: approximately 30 seconds]", "As you can see, the waveforms were clear and stable, with minimal motion artifacts.", "This demonstrates the feasibility of our novel device."], "th": ["ต่อไป ผมขอนำเสนอผลการศึกษาของเรา", "ดังที่แสดงในวิดีโอนี้ เราสามารถบันทึกรูปคลื่นไฟฟ้าหัวใจที่มีความเสถียรจากนกขนาดเล็กที่ยังรู้สึกตัวได้", "การบันทึกนี้ได้มาจากนกแก้วกรีนชีคคอนัวร์ โดยไม่ใช้ยาซึมหรือยาสลบ", "[วิดีโอ: ประมาณ 30 วินาที]", "ดังที่ทุกท่านเห็น รูปคลื่นไฟฟ้าหัวใจมีความชัดเจนและมีความเสถียร โดยมีสัญญาณรบกวนจากการเคลื่อนไหวของร่างกายน้อยมาก", "ผลลัพธ์นี้แสดงให้เห็นถึงความเป็นไปได้ในการใช้งานอุปกรณ์ชนิดใหม่ที่เราพัฒนาขึ้น"], "ja": ["それでは、研究結果についてご説明します。", "この動画に示すように、覚醒下の小型鳥類から安定した心電図波形を記録することができました。", "この心電図は、鎮静や麻酔を使用せずに、ウロコインコから記録したものです。", "［動画：約30秒］", "ご覧のように、体動によるアーチファクトはほとんど認められず、明瞭で安定した心電図波形が得られました。", "この結果は、私たちが開発した新しいデバイスの実用可能性を示しています。"]}, {"number": 13, "heading": "Results: Reference Waveforms", "en": ["Next, we established baseline ECG waveforms for four small psittacine species.", "These included the Budgerigar, Barred Parakeet, Green-cheeked Parakeet, and Cockatiel.", "We measured the amplitudes of the P, Q, R, S, and T waves.", "Although waveform amplitudes differed among species, the characteristic negative S wave was consistently observed.", "These data provide preliminary baseline information for evaluating ECG abnormalities in clinical patients."], "th": ["ต่อไป เราได้ศึกษารูปคลื่นไฟฟ้าหัวใจพื้นฐานในนกแก้วขนาดเล็ก 4 ชนิด", "ได้แก่ นกหงส์หยก นกแก้วบาร์เรดพาราคีต นกแก้วกรีนชีคคอนัวร์ และนกค็อกคาเทล", "เราได้วัดแอมพลิจูดของคลื่น P, Q, R, S และ T", "แม้ว่าแอมพลิจูดของรูปคลื่นจะแตกต่างกันระหว่างนกแต่ละชนิด แต่เราพบคลื่น S ที่เป็นลบซึ่งเป็นลักษณะเฉพาะอย่างสม่ำเสมอในนกทุกชนิดที่ศึกษา", "ข้อมูลเหล่านี้เป็นข้อมูลพื้นฐานเบื้องต้นที่สามารถนำไปใช้ในการประเมินความผิดปกติของคลื่นไฟฟ้าหัวใจในนกป่วยทางคลินิก"], "ja": ["次に、4種類の小型オウム・インコ類について、基本となる心電図波形を明らかにしました。", "対象としたのは、セキセイインコ、サザナミインコ、ウロコインコ、オカメインコです。", "P波、Q波、R波、S波、T波の振幅を測定しました。", "波形の振幅には鳥種間で違いが認められましたが、特徴的な陰性S波はすべての鳥種で一貫して観察されました。", "これらのデータは、臨床症例における心電図異常を評価するための予備的な基礎データとなります。"]}, {"number": 14, "heading": "Results: Arrhythmia Detection", "en": ["We next evaluated whether this method could detect arrhythmias.", "This video shows an abnormal cardiac rhythm recorded from a conscious Sun Conure.", "[Video: approximately 30 seconds]", "As you can see, the abnormal rhythm can be clearly visualized without sedation or anesthesia.", "Therefore, our method may be useful for detecting arrhythmias in conscious birds."], "th": ["ต่อมา เราได้ประเมินว่าวิธีการนี้สามารถตรวจพบภาวะหัวใจเต้นผิดจังหวะได้หรือไม่", "วิดีโอนี้แสดงจังหวะการเต้นของหัวใจที่ผิดปกติ ซึ่งบันทึกได้จากนกแก้วซันคอนัวร์ที่ยังรู้สึกตัว", "[วิดีโอ: ประมาณ 30 วินาที]", "ดังที่ทุกท่านเห็น เราสามารถสังเกตเห็นจังหวะการเต้นของหัวใจที่ผิดปกติได้อย่างชัดเจน โดยไม่ต้องใช้ยาซึมหรือยาสลบ", "ดังนั้น วิธีการของเราอาจเป็นประโยชน์ในการตรวจหาภาวะหัวใจเต้นผิดจังหวะในนกที่ยังรู้สึกตัว"], "ja": ["次に、この方法で不整脈を検出できるかどうかを評価しました。", "この動画は、覚醒下のコガネメキシコインコから記録された異常な心拍リズムを示しています。", "［動画：約30秒］", "ご覧のように、鎮静や麻酔を使用することなく、異常な心拍リズムを明瞭に確認することができました。", "したがって、私たちの方法は、覚醒下の鳥類における不整脈の検出に有用である可能性があります。"]}, {"number": 15, "heading": "Conclusion", "en": ["In conclusion, we achieved three important findings.", "First, our novel coil-shaped device enabled safe and rapid ECG recording in conscious small birds without sedation or anesthesia.", "Second, we established baseline ECG waveforms across four small psittacine species.", "Third, we demonstrated the clinical utility of this method for visualizing and detecting avian arrhythmias.", "Taken together, these findings suggest that this technique provides a practical foundation for ECG evaluation in avian clinical practice."], "th": ["โดยสรุป การศึกษาของเราได้ผลการค้นพบที่สำคัญ 3 ประการ", "ประการแรก อุปกรณ์รูปขดลวดชนิดใหม่ที่เราพัฒนาขึ้นช่วยให้สามารถบันทึกคลื่นไฟฟ้าหัวใจในนกขนาดเล็กที่ยังรู้สึกตัวได้อย่างปลอดภัยและรวดเร็ว โดยไม่จำเป็นต้องใช้ยาซึมหรือยาสลบ", "ประการที่สอง เราได้ศึกษารูปคลื่นไฟฟ้าหัวใจพื้นฐานในนกแก้วขนาดเล็ก 4 ชนิด", "ประการที่สาม เราได้แสดงให้เห็นถึงประโยชน์ทางคลินิกของวิธีการนี้ในการแสดงภาพและตรวจหาภาวะหัวใจเต้นผิดจังหวะในนก", "เมื่อพิจารณาผลการศึกษาทั้งหมดร่วมกัน ผลลัพธ์เหล่านี้ชี้ให้เห็นว่าเทคนิคนี้สามารถเป็นพื้นฐานที่นำไปใช้ได้จริงสำหรับการประเมินคลื่นไฟฟ้าหัวใจในเวชปฏิบัติทางคลินิกสำหรับนก"], "ja": ["結論として、本研究では3つの重要な成果が得られました。", "第一に、私たちが開発した新しいコイル状デバイスにより、鎮静や麻酔を使用することなく、覚醒下の小型鳥類から安全かつ迅速に心電図を記録することができました。", "第二に、4種類の小型オウム・インコ類における基本的な心電図波形を明らかにしました。", "第三に、鳥類の不整脈を可視化し、検出するための本方法の臨床的有用性を示しました。", "これらの結果を総合すると、本技術は鳥類臨床における心電図評価のための実用的な基盤となることが示唆されます。"]}, {"number": 16, "heading": "Future Perspectives", "en": ["Looking toward the future, we aim to establish more robust reference intervals by increasing the sample size and including birds of different ages and sexes.", "We also plan to combine ECG with echocardiography for comprehensive cardiovascular evaluation.", "Finally, we hope to extend this method to other avian species, including passerines and larger psittacines.", "These efforts may contribute to further advances in avian cardiovascular medicine."], "th": ["สำหรับแนวทางการศึกษาในอนาคต เรามุ่งหวังที่จะกำหนดช่วงค่าอ้างอิงที่มีความน่าเชื่อถือมากยิ่งขึ้น โดยเพิ่มจำนวนตัวอย่างและรวมนกที่มีอายุและเพศแตกต่างกัน", "นอกจากนี้ เรายังวางแผนที่จะใช้การตรวจคลื่นไฟฟ้าหัวใจร่วมกับการตรวจหัวใจด้วยคลื่นเสียงความถี่สูง เพื่อประเมินระบบหัวใจและหลอดเลือดอย่างครอบคลุม", "สุดท้ายนี้ เราหวังว่าจะสามารถขยายการใช้วิธีการนี้ไปยังนกชนิดอื่น ๆ รวมถึงนกในอันดับนกเกาะคอน (Passeriformes) และนกแก้วที่มีขนาดใหญ่ขึ้น", "ความพยายามเหล่านี้อาจมีส่วนช่วยส่งเสริมความก้าวหน้าในการแพทย์ด้านหัวใจและหลอดเลือดของนกต่อไป"], "ja": ["今後の展望として、対象個体数を増やし、さまざまな年齢や性別の鳥類を含めることで、より信頼性の高い基準範囲を確立することを目指しています。", "また、心電図検査と心エコー検査を組み合わせることで、心血管系の包括的な評価を行うことも計画しています。", "さらに、この方法をスズメ目の鳥類や、より大型のオウム・インコ類を含む、他の鳥種にも応用していきたいと考えています。", "これらの取り組みは、鳥類の循環器医療のさらなる発展に貢献する可能性があります。"]}, {"number": 17, "heading": "Take-Home Message", "en": ["Finally, I would like to summarize the take-home messages.", "First, our novel coil-shaped device enables safe and anesthesia-free ECG recording in conscious small birds during routine handling.", "Second, the baseline waveforms established in four small psittacine species provide an important benchmark for identifying ECG abnormalities and arrhythmias.", "Third, routine ECG recording in conscious birds may open new possibilities for earlier diagnosis and advanced cardiovascular care.", "To conclude, this novel device provides a practical and non-invasive foundation for avian ECG analysis.", "Thank you very much for your kind attention."], "th": ["สุดท้ายนี้ ผมขอสรุปประเด็นสำคัญที่ได้จากการศึกษาของเรา", "ประการแรก อุปกรณ์รูปขดลวดชนิดใหม่ที่เราพัฒนาขึ้นช่วยให้สามารถบันทึกคลื่นไฟฟ้าหัวใจในนกขนาดเล็กที่ยังรู้สึกตัวได้อย่างปลอดภัย โดยไม่ต้องใช้ยาสลบ ในระหว่างการจับบังคับนกตามปกติ", "ประการที่สอง รูปคลื่นไฟฟ้าหัวใจพื้นฐานที่ได้จากนกแก้วขนาดเล็ก 4 ชนิด เป็นเกณฑ์อ้างอิงที่สำคัญสำหรับการระบุความผิดปกติของคลื่นไฟฟ้าหัวใจและภาวะหัวใจเต้นผิดจังหวะ", "ประการที่สาม การบันทึกคลื่นไฟฟ้าหัวใจเป็นประจำในนกที่ยังรู้สึกตัว อาจเปิดโอกาสใหม่ ๆ สำหรับการวินิจฉัยโรคได้ตั้งแต่ระยะเริ่มต้น และการดูแลรักษาโรคหัวใจและหลอดเลือดที่ก้าวหน้ายิ่งขึ้น", "โดยสรุป อุปกรณ์ชนิดใหม่นี้เป็นพื้นฐานที่สามารถนำไปใช้ได้จริงและไม่รุกรานร่างกาย สำหรับการวิเคราะห์คลื่นไฟฟ้าหัวใจในนก", "ขอขอบพระคุณทุกท่านเป็นอย่างสูงที่กรุณารับฟังครับ"], "ja": ["最後に、本研究の重要なポイントをまとめたいと思います。", "第一に、私たちが開発した新しいコイル状デバイスにより、通常の保定中に、覚醒下の小型鳥類から安全かつ無麻酔で心電図を記録することができます。", "第二に、4種類の小型オウム・インコ類で得られた基本的な心電図波形は、心電図異常や不整脈を識別するための重要な指標となります。", "第三に、覚醒下の鳥類における日常的な心電図記録は、心疾患の早期診断や、より高度な循環器診療に新たな可能性をもたらすと考えられます。", "結論として、この新しいデバイスは、鳥類の心電図解析のための実用的かつ非侵襲的な基盤を提供するものです。", "ご清聴ありがとうございました。"]}];
const root=document.getElementById('slides');
function render(lang){root.replaceChildren();document.documentElement.lang=lang;for(const s of slides){const sec=document.createElement('section');const h=document.createElement('h2');h.textContent=`Slide ${s.number} — ${s.heading}`;sec.append(h);for(const t of s[lang]){const p=document.createElement('p');p.className='paragraph';p.textContent=t;sec.append(p)}root.append(sec)}for(const b of document.querySelectorAll('[data-lang]'))b.setAttribute('aria-pressed',String(b.dataset.lang===lang));}
for(const b of document.querySelectorAll('[data-lang]'))b.addEventListener('click',()=>{render(b.dataset.lang);location.hash=b.dataset.lang});render(['en','ja','th'].includes(location.hash.slice(1))?location.hash.slice(1):'en');
</script></body></html>
