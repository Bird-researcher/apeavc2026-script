<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEAVC 2026 | 7-minute Presentation Script</title><style>body{font-family:system-ui,-apple-system,"Noto Sans Thai","Noto Sans JP",sans-serif;background:#f5f7fa;color:#203043;margin:0}header{background:#17344e;color:white;padding:30px max(20px,calc((100% - 820px)/2))}h1{font-size:1.5rem;margin:0 0 8px}main{max-width:820px;margin:auto;padding:24px 16px 60px}.langs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}button{border:1px solid #2b5470;background:white;border-radius:9px;padding:12px 18px;font-size:1rem;cursor:pointer}button[aria-pressed=true]{background:#173f60;color:white}article{background:white;padding:18px 22px;margin:14px 0;border-radius:12px;box-shadow:0 2px 8px #20304313}h2{font-size:1rem;color:#275d83;margin:0 0 12px}.script{white-space:pre-line;line-height:1.8;font-size:1.08rem}small{opacity:.85}</style></head><body><header><h1>APEAVC 2026 · Presentation Script</h1><small>Electrocardiographic Waveforms in Conscious Small Psittacines Using a Novel Device · 7-minute version</small></header><main><div class="langs" role="group" aria-label="Select language"><button onclick="setLang('en')" id="en">English</button><button onclick="setLang('ja')" id="ja">日本語</button><button onclick="setLang('th')" id="th">ภาษาไทย</button></div><div id="slides"></div></main><script>const data={"en": ["Now, let me begin my presentation.\nFor those who would like to follow the presentation more easily, I have prepared a presentation script in English, Japanese, and Thai. Please feel free to scan the QR code on this slide.", "Good Morning, everyone.\nMy name is Masaya Mizukami, from Avian Medical Center Mizukami in Japan.\nToday, I would like to present our study entitled,“Electrocardiographic Waveforms in Conscious Small Psittacines Using a Novel Device.\n”In this study, we developed a novel coil-shaped device for ECG recording in conscious small birds, without sedation or anesthesia.", "First, I would like to briefly introduce the background. \nVarious cardiac diseases have been reported in birds, indicating that cardiovascular disease is an important clinical problem.", "Various arrhythmias have also been reported in birds. \nTherefore, accurate ECG evaluation is important for detecting cardiac abnormalities", "However, obtaining　an ECG from small birds is challenging. Standard ECG recording is often complicated by handling stress and motion artifacts. Therefore, we needed a simple and reliable method for ECG recording in conscious birds.", "Based on these challenges, we established　three objectives, as shown here: to evaluate our novel device, to establish baseline ECG waveforms, and to evaluate its clinical utility.", "We developed a novel coil-shaped　electrode device for ECG recording in small birds. The device is simply attached to the examiner's finger during routine restrain", "For ECG recording, the birds were restrained using a standard restraint technique. \nThe feathers were parted, and ECG cream was applied to the exposed skin. \nThe new device was then attached to the fingers, and the electrodes were positioned as shown here.", "This method has three main advantages. \nFirst, it requires no sedation or anesthesia.\n Second, anyone who can properly restrain small birds can easily perform the measurement. \nFinally, the procedure is safe, quick, and easy.", "This study was conducted from 2020 to 2023. \nWe examined twenty-two conscious small parakeets without sedation or anesthesia and obtained clean and stable ECG waveforms", "We selected the four avian species with the highest number of measurements.\n For each individual, five stable Lead II waveforms were extracted. \nWe then calculated and analyzed the mean values for each species.", "Now, I would like to present　our results. \nWe obtained stable ECG waveforms from conscious small birds, as shown in this video. \nNo sedation or anesthesia was used, and the waveforms were clear and stable.\nThis demonstrates the feasibility of our novel device.", "Next, we established reference ECG waveforms for four small psittacine species. \nWe measured the amplitudes of the P, Q, R, S, and T waves.\nThese data provide a baseline for evaluating ECG abnormalities in clinical patients.", "We next evaluated whether this method could detect arrhythmias. \nAs shown in this video, abnormal rhythms can be clearly visualized without sedation or anesthesia. \nTherefore, our method supports detection of arrhythmias in conscious birds", "In conclusion, we achieved three important findings.\nFirst, the novel coil-shaped device enabled safe and rapid ECG recording in conscious small birds without sedation or anesthesia.\nSecond, we established baseline ECG waveforms across four small psittacine species.\nThird, we demonstrated the clinical utility of this method for visualizing and detecting avian arrhythmias.\nTaken together, this technique provides a practical and reliable foundation for ECG evaluation in avian clinical practice.", "This study demonstrated a practical and reproducible ECG recording method in conscious small psittacines.\nBy establishing reference values for each species, we provide a solid foundation for clinical ECG evaluation in birds.\nThis approach may support earlier and more accurate diagnosis of cardiac disease in birds.", "Finally, I would like to summarize the take-home messages.\nFirst, our novel coil-shaped device enables safe and anesthesia-free ECG recording in conscious small birds during routine handling.\nSecond, the reference waveforms established in four small psittacine species provide an important benchmark for identifying ECG abnormalities and arrhythmias.\nThird, routine ECG recording in conscious birds may open new possibilities for earlier diagnosis and advanced cardiovascular care.\nTo conclude, this novel device provides a practical and non-invasive foundation for avian ECG analysis.\nThank you very much for your kind attention."], "ja": ["それでは発表を始めます。発表内容をより理解しやすいよう、英語、日本語、タイ語の発表原稿を用意しました。このスライドのQRコードをぜひ読み取ってください。", "皆様、おはようございます。日本のみずかみ鳥の病院の水上昌也です。本日は「新規デバイスを用いた無麻酔下の小型インコ類における心電図波形」について発表します。本研究では、鎮静や麻酔を使用せず、意識のある小型鳥類の心電図を記録する新しいコイル状デバイスを開発しました。", "まず背景を簡単に説明します。鳥類ではさまざまな心疾患が報告されており、心血管疾患が重要な臨床上の問題であることが分かります。", "鳥類ではさまざまな不整脈も報告されています。したがって、心臓の異常を検出するには正確な心電図評価が重要です。", "しかし、小型鳥類から心電図を得ることは困難です。従来の心電図記録は、保定によるストレスや体動アーチファクトの影響を受けやすいという問題があります。そのため、意識のある鳥類の心電図を記録するための、簡便で信頼性の高い方法が必要でした。", "これらの課題を踏まえ、ここに示す3つの目的を設定しました。新規デバイスの評価、基準となる心電図波形の確立、そして臨床的有用性の評価です。", "小型鳥類の心電図記録のため、新しいコイル状電極デバイスを開発しました。このデバイスは通常の保定時に検査者の指に装着するだけで使用できます。", "心電図記録には標準的な保定法を用いました。羽毛を分けて露出した皮膚に心電図クリームを塗布しました。その後、新しいデバイスを指に装着し、図に示すように電極を配置しました。", "この方法には3つの主な利点があります。第一に鎮静や麻酔を必要としません。第二に、小型鳥類を適切に保定できる人であれば容易に測定できます。最後に、安全で迅速かつ簡便な手技です。", "本研究は2020年から2023年に実施しました。鎮静や麻酔を行わず、意識のある小型インコ22羽を検査し、明瞭で安定した心電図波形を得ました。", "測定数が最も多かった4鳥種を選択しました。各個体から安定した第II誘導の波形を5つ抽出しました。その後、鳥種ごとに平均値を算出して解析しました。", "それでは結果を紹介します。この動画に示すように、意識のある小型鳥類から安定した心電図波形が得られました。鎮静や麻酔は使用しておらず、波形は明瞭で安定していました。これは新規デバイスの実行可能性を示しています。", "次に、小型インコ類4鳥種の基準となる心電図波形を確立しました。P波、Q波、R波、S波、T波の振幅を測定しました。これらのデータは臨床症例における心電図異常の評価の基礎となります。", "続いて、この方法で不整脈を検出できるか評価しました。この動画に示すように、鎮静や麻酔を行わずに異常なリズムを明瞭に可視化できます。したがって、本法は意識のある鳥類の不整脈検出に役立ちます。", "結論として、3つの重要な成果が得られました。第一に、新しいコイル状デバイスにより、鎮静や麻酔なしで意識のある小型鳥類の心電図を安全かつ迅速に記録できました。第二に、小型インコ類4鳥種の基準心電図波形を確立しました。第三に、鳥類の不整脈を可視化・検出する臨床的有用性を示しました。総合すると、本技術は鳥類臨床での心電図評価に実用的で信頼性の高い基盤を提供します。", "本研究では、意識のある小型インコ類で実用的かつ再現性のある心電図記録法を示しました。鳥種ごとの基準値を確立することにより、鳥類の臨床的心電図評価の確かな基礎を提供します。この方法は、鳥類の心疾患をより早期かつ正確に診断することに役立つ可能性があります。", "最後に、重要なポイントをまとめます。第一に、新しいコイル状デバイスにより、通常の保定中に意識のある小型鳥類の心電図を安全に、麻酔なしで記録できます。第二に、小型インコ類4鳥種で確立した基準波形は、心電図異常や不整脈を見つけるための重要な指標となります。第三に、意識のある鳥類で日常的に心電図を記録することは、早期診断と高度な心血管診療の新たな可能性を開きます。結論として、本デバイスは鳥類の心電図解析に実用的で非侵襲的な基盤を提供します。ご清聴ありがとうございました。"], "th": ["ต่อไปนี้ผมขอเริ่มการนำเสนอครับ สำหรับผู้ที่ต้องการติดตามเนื้อหาได้สะดวกยิ่งขึ้น ผมได้เตรียมบทบรรยายเป็นภาษาอังกฤษ ภาษาญี่ปุ่น และภาษาไทยไว้แล้ว กรุณาสแกนคิวอาร์โค้ดบนสไลด์นี้ได้เลยครับ", "สวัสดีตอนเช้าทุกท่านครับ ผมชื่อมาซายะ มิซึคามิ จากศูนย์การแพทย์นกมิซึคามิ ประเทศญี่ปุ่น วันนี้ผมจะนำเสนอการศึกษาเรื่องรูปคลื่นไฟฟ้าหัวใจในนกแก้วขนาดเล็กที่รู้สึกตัว โดยใช้อุปกรณ์ชนิดใหม่ ในการศึกษานี้ เราพัฒนาอุปกรณ์รูปขดลวดสำหรับบันทึกคลื่นไฟฟ้าหัวใจในนกขนาดเล็กที่รู้สึกตัว โดยไม่ใช้ยาซึมหรือยาสลบ", "ก่อนอื่น ผมขอกล่าวถึงความเป็นมาโดยสังเขป มีรายงานโรคหัวใจหลายชนิดในนก ซึ่งแสดงว่าโรคหัวใจและหลอดเลือดเป็นปัญหาสำคัญทางคลินิก", "มีรายงานภาวะหัวใจเต้นผิดจังหวะหลายชนิดในนกเช่นกัน ดังนั้นการประเมินคลื่นไฟฟ้าหัวใจอย่างแม่นยำจึงมีความสำคัญต่อการตรวจพบความผิดปกติของหัวใจ", "อย่างไรก็ตาม การบันทึกคลื่นไฟฟ้าหัวใจในนกขนาดเล็กเป็นเรื่องท้าทาย วิธีมาตรฐานมักได้รับผลกระทบจากความเครียดระหว่างการจับบังคับและสัญญาณรบกวนจากการเคลื่อนไหว ดังนั้นเราจึงต้องการวิธีที่ง่ายและเชื่อถือได้สำหรับบันทึกคลื่นไฟฟ้าหัวใจในนกที่รู้สึกตัว", "จากปัญหาเหล่านี้ เรากำหนดวัตถุประสงค์สามประการดังที่แสดงไว้ ได้แก่ ประเมินอุปกรณ์ใหม่ สร้างข้อมูลรูปคลื่นไฟฟ้าหัวใจพื้นฐาน และประเมินประโยชน์ทางคลินิก", "เราพัฒนาอุปกรณ์ขั้วไฟฟ้ารูปขดลวดชนิดใหม่สำหรับบันทึกคลื่นไฟฟ้าหัวใจในนกขนาดเล็ก อุปกรณ์นี้ติดกับนิ้วมือของผู้ตรวจได้ง่ายระหว่างการจับบังคับตามปกติ", "ในการบันทึกคลื่นไฟฟ้าหัวใจ เราจับบังคับนกด้วยวิธีมาตรฐาน แหวกขนและทาครีมสำหรับตรวจคลื่นไฟฟ้าหัวใจบนผิวหนังที่เปิดออก จากนั้นติดอุปกรณ์ใหม่กับนิ้วมือและวางขั้วไฟฟ้าตามภาพ", "วิธีนี้มีข้อดีหลักสามประการ ประการแรก ไม่จำเป็นต้องใช้ยาซึมหรือยาสลบ ประการที่สอง ผู้ที่จับบังคับนกขนาดเล็กได้อย่างเหมาะสมสามารถทำการตรวจได้ง่าย และประการสุดท้าย ขั้นตอนนี้ปลอดภัย รวดเร็ว และง่าย", "การศึกษานี้ดำเนินการระหว่างปี 2020 ถึง 2023 เราตรวจนกแก้วขนาดเล็กที่รู้สึกตัวจำนวน 22 ตัวโดยไม่ใช้ยาซึมหรือยาสลบ และได้รูปคลื่นไฟฟ้าหัวใจที่ชัดเจนและเสถียร", "เราเลือกนกสี่ชนิดที่มีจำนวนการวัดมากที่สุด สำหรับนกแต่ละตัว เราคัดเลือกรูปคลื่นที่เสถียรจากลีด II จำนวนห้ารูปคลื่น จากนั้นคำนวณและวิเคราะห์ค่าเฉลี่ยของแต่ละชนิด", "ต่อไปผมขอนำเสนอผลการศึกษา ดังที่เห็นในวิดีโอนี้ เราสามารถบันทึกรูปคลื่นไฟฟ้าหัวใจที่เสถียรจากนกขนาดเล็กที่รู้สึกตัวได้ โดยไม่ใช้ยาซึมหรือยาสลบ และได้รูปคลื่นที่ชัดเจนและเสถียร ผลนี้แสดงถึงความเป็นไปได้ในการใช้อุปกรณ์ใหม่ของเรา", "จากนั้นเราสร้างข้อมูลรูปคลื่นไฟฟ้าหัวใจอ้างอิงสำหรับนกแก้วขนาดเล็กสี่ชนิด เราวัดแอมพลิจูดของคลื่น P, Q, R, S และ T ข้อมูลเหล่านี้เป็นพื้นฐานสำหรับประเมินความผิดปกติของคลื่นไฟฟ้าหัวใจในผู้ป่วย", "ต่อมาเราประเมินว่าวิธีนี้สามารถตรวจพบภาวะหัวใจเต้นผิดจังหวะได้หรือไม่ ดังที่เห็นในวิดีโอ สามารถแสดงจังหวะหัวใจที่ผิดปกติได้อย่างชัดเจนโดยไม่ใช้ยาซึมหรือยาสลบ ดังนั้นวิธีของเราจึงช่วยตรวจพบภาวะหัวใจเต้นผิดจังหวะในนกที่รู้สึกตัว", "โดยสรุป เราได้ผลสำคัญสามประการ ประการแรก อุปกรณ์รูปขดลวดชนิดใหม่ช่วยให้บันทึกคลื่นไฟฟ้าหัวใจในนกขนาดเล็กที่รู้สึกตัวได้อย่างปลอดภัยและรวดเร็วโดยไม่ใช้ยาซึมหรือยาสลบ ประการที่สอง เราสร้างรูปคลื่นพื้นฐานสำหรับนกแก้วขนาดเล็กสี่ชนิด ประการที่สาม เราแสดงประโยชน์ทางคลินิกในการแสดงและตรวจพบภาวะหัวใจเต้นผิดจังหวะในนก โดยรวมแล้ว เทคนิคนี้เป็นพื้นฐานที่ใช้งานได้จริงและเชื่อถือได้สำหรับการประเมินคลื่นไฟฟ้าหัวใจในเวชปฏิบัตินก", "การศึกษานี้แสดงวิธีบันทึกคลื่นไฟฟ้าหัวใจที่ใช้งานได้จริงและทำซ้ำได้ในนกแก้วขนาดเล็กที่รู้สึกตัว การกำหนดค่าอ้างอิงสำหรับแต่ละชนิดช่วยสร้างพื้นฐานที่มั่นคงสำหรับการประเมินคลื่นไฟฟ้าหัวใจทางคลินิกในนก วิธีนี้อาจช่วยให้วินิจฉัยโรคหัวใจในนกได้เร็วขึ้นและแม่นยำยิ่งขึ้น", "สุดท้ายผมขอสรุปประเด็นสำคัญ ประการแรก อุปกรณ์รูปขดลวดชนิดใหม่ช่วยให้บันทึกคลื่นไฟฟ้าหัวใจในนกขนาดเล็กที่รู้สึกตัวได้อย่างปลอดภัยโดยไม่ใช้ยาสลบระหว่างการจับบังคับตามปกติ ประการที่สอง รูปคลื่นอ้างอิงจากนกแก้วขนาดเล็กสี่ชนิดเป็นเกณฑ์สำคัญในการระบุความผิดปกติของคลื่นไฟฟ้าหัวใจและภาวะหัวใจเต้นผิดจังหวะ ประการที่สาม การบันทึกคลื่นไฟฟ้าหัวใจเป็นประจำในนกที่รู้สึกตัวอาจเปิดโอกาสใหม่สำหรับการวินิจฉัยระยะแรกและการดูแลโรคหัวใจและหลอดเลือดขั้นสูง โดยสรุป อุปกรณ์นี้เป็นพื้นฐานที่ใช้งานได้จริงและไม่รุกล้ำสำหรับการวิเคราะห์คลื่นไฟฟ้าหัวใจในนก ขอบคุณทุกท่านที่รับฟังครับ"]};function setLang(lang){document.documentElement.lang=lang;for(const id of ['en','ja','th'])document.getElementById(id).setAttribute('aria-pressed',String(id===lang));const root=document.getElementById('slides');root.replaceChildren();data[lang].forEach((t,i)=>{const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('div');h.textContent=(lang==='ja'?'スライド ':lang==='th'?'สไลด์ ':'Slide ')+(i+1);p.className='script';p.textContent=t;a.append(h,p);root.append(a)});history.replaceState(null,'','#'+lang)}setLang(['en','ja','th'].includes(location.hash.slice(1))?location.hash.slice(1):'en');</script></body></html>
