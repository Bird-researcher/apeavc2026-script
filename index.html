en:`Based on these challenges, we defined three objectives: to evaluate the feasibility of our novel device, to describe preliminary Lead II ECG waveforms, and to explore its potential for visualizing abnormal rhythms.`,

ดังที่แสดงในวิดีโอ เราสามารถเห็นจังหวะหัวใจที่ผิดปกติได้อย่างชัดเจน โดยไม่ใช้ยาระงับประสาทหรือยาสลบ

en:`In conclusion, our study yielded three main findings.

},
{
en:`Looking ahead, we have three priorities.

ja:`今後の課題は3つあります。

第二に、個体数を増やし、異なる年齢や性別の鳥を含めることで、信頼性の高い鳥種別の基準範囲を確立することです。

第三に、スズメ目や大型のインコ・オウム類など、他の鳥種にも本法を応用することです。`,
th:`ในอนาคต เรามีเป้าหมายหลักสามข้อ

function show(lang){
 document.documentElement.lang=lang;
 document.querySelectorAll("button").forEach(b=>{
  b.classList.toggle("active",b.dataset.lang===lang);
 });
 const root=document.getElementById("content");
 root.replaceChildren();
 slides.forEach((slide,i)=>{
  const section=document.createElement("section");
  const heading=document.createElement("h2");
  heading.textContent="Slide "+(i+1);
  const paragraph=document.createElement("p");
  paragraph.textContent=slide[lang];
  section.append(heading,paragraph);
  root.appendChild(section);
 });
}
show("en");
